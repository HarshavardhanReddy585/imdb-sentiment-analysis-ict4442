name: Update README repository structure

on:
  push:
    branches: [main]
    paths-ignore:
      - README.md

permissions:
  contents: write

jobs:
  update-structure:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate repository tree
        run: python scripts/update_readme_structure.py

      - name: Commit README when the tree changed
        run: |
          if git diff --quiet -- README.md; then
            echo "README structure is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update README repository structure [skip ci]"
          git push
